name: Build Android APK

on:
  workflow_dispatch: # Cho phép sếp bấm chạy thủ công
  push:
    branches: [ "main", "master" ] # Tự động chạy khi có code mới đẩy lên

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cấp quyền thực thi cho Gradle
        run: chmod +x gradlew

      - name: Tiến hành Build APK (bản Debug)
        run: ./gradlew assembleDebug

      - name: Đóng gói và lưu file APK
        uses: actions/upload-artifact@v4
        with:
          name: byd-audio-feedback-apk
          path: '**/build/outputs/apk/debug/*.apk'
